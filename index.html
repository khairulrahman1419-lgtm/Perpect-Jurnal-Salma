    <script>
      // Gracefully handle Vite dev HMR websocket disconnects in AI Studio preview iframe
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && (String(e.reason.message || e.reason).includes('WebSocket closed without opened') || String(e.reason).includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket closed without opened') || e.message.includes('WebSocket'))) {
          e.preventDefault();
        }
      });
      const _origErr = console.error;
      console.error = function (...args) {
        const str = args.map(function(a) { return (a && a.message) || String(a); }).join(' ');
        if (str.includes('WebSocket closed without opened') || str.includes('[vite] failed to connect to websocket')) {
          return;
        }
        _origErr.apply(console, args);
      };
    </script>
