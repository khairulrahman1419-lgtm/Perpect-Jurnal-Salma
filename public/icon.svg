<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner Soft Halo -->
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" fill-opacity="0.12" />

  <!-- Central Heart with Baby Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 250)">
    <!-- Big Heart -->
    <path d="M0,80 C-140,-40 -160,-150 -70,-190 C-10,-210 0,-130 0,-130 C0,-130 10,-210 70,-190 C160,-150 140,-40 0,80 Z" fill="#FFFFFF" />

    <!-- Cute Baby Face & Pacifier / Smile inside the heart -->
    <!-- Smiling Eyes -->
    <path d="M-45,-105 Q-30,-125 -15,-105" stroke="#0D9488" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M15,-105 Q30,-125 45,-105" stroke="#0D9488" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Blushing Cheeks -->
    <circle cx="-50" cy="-85" r="9" fill="#FDA4AF" opacity="0.85" />
    <circle cx="50" cy="-85" r="9" fill="#FDA4AF" opacity="0.85" />

    <!-- Pacifier Handle & Ring -->
    <path d="M0,-75 C-18,-75 -22,-50 0,-50 C22,-50 18,-75 0,-75 Z" fill="#14B8A6" />
    <circle cx="0" cy="-42" r="16" fill="none" stroke="#F59E0B" stroke-width="6" />

    <!-- Little Sprouts / Growth Leaf at Top -->
    <path d="M0,-140 C-25,-175 -5,-200 0,-185 C5,-200 25,-175 0,-140 Z" fill="#FDE047" />
  </g>

  <!-- Bottom subtitle indicator -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">TUMBUHKEMBANG</text>
</svg>
